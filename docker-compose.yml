services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ids_sentinel
      POSTGRES_USER: ids_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids_user -d ids_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ids_user:${POSTGRES_PASSWORD:-ids_local_password}@postgres:5432/ids_sentinel
      MODEL_DIR: /app/model/artifacts
      REDIS_ENABLED: "false"
      PUBLIC_SERVER_URL: http://localhost:8000
    volumes:
      - ./model/artifacts:/app/model/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
